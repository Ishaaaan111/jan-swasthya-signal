<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="saffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#0E6B05"/>
    </linearGradient>
    <linearGradient id="chakraBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000080"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Badge -->
  <rect width="64" height="64" rx="16" fill="#0B1329" />
  
  <!-- Tricolor Top & Bottom Accent Bars -->
  <path d="M 12 8 L 52 8 C 55 8 56 10 56 12 L 8 12 C 8 10 9 8 12 8 Z" fill="url(#saffron)" />
  <path d="M 8 52 L 56 52 C 56 54 55 56 52 56 L 12 56 C 9 56 8 54 8 52 Z" fill="url(#green)" />
  <rect x="8" y="13" width="48" height="2" fill="#FFFFFF" opacity="0.9" />

  <!-- Outer Medical Cross with Chakra Core -->
  <circle cx="32" cy="32" r="17" fill="#102A43" stroke="#2D3748" stroke-width="1.5" />
  
  <!-- Ashoka Chakra 24 Spokes Stylized -->
  <circle cx="32" cy="32" r="13" fill="none" stroke="url(#chakraBlue)" stroke-width="2" />
  <circle cx="32" cy="32" r="3.5" fill="#000080" />
  
  <!-- ECG / Signal Pulse Overlay -->
  <path d="M 16 32 L 23 32 L 27 20 L 32 44 L 37 24 L 41 32 L 48 32" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="37" cy="24" r="2" fill="#FFFFFF" />
</svg>